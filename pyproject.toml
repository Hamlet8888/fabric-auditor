[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-automation-tools"
version = "0.2.0"
description = "Check BGP EVPN/VXLAN Multi-Site fabrics against the expected state from network-design"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
netauto = "netauto.cli:main"

[tool.setuptools]
packages = ["netauto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
