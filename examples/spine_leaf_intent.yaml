# ---------------------------------------------------------------------------
# fabric-auditor intent: multi-site BGP EVPN/VXLAN spine-leaf fabric.
#
# FICTIONAL DATA. Hostnames, ASNs (RFC 6996 private range) and addresses are
# invented for the demo and the unit tests.
#
# Design:
#   * eBGP underlay (IPv4 unicast) on the point-to-point fabric links.
#     Spines in a pod share one ASN; each leaf pair has its own ASN.
#   * eBGP EVPN overlay between loopbacks, leaf <-> every spine in the pod.
#   * Route targets are set explicitly. With eBGP, "route-target auto" would
#     derive ASN:VNI per leaf pair and the pairs would never import each
#     other's routes.
#   * Route distinguishers are type-1 (router-id:index), unique per device.
#
# Route targets are quoted on purpose: YAML 1.1 (PyYAML) reads an unquoted
# 65000:10100 as a base-60 integer.
# ---------------------------------------------------------------------------

fabric:
  name: corp-dc-fabric
  mtu: 9216                         # jumbo frames on every fabric link (RoCEv2 + VXLAN overhead)
  route_distinguisher:
    l2: "{router_id}:{vlan}"        # per L2VNI (MAC-VRF)
    l3: "{router_id}:{vrf_id}"      # per L3VNI (IP-VRF)

# L2VNIs. Stretched segments use the same VNI and RT in both data centers.
segments:
  - {vlan: 100, vni: 10100, name: WEB,     route_target: "65000:10100"}
  - {vlan: 200, vni: 10200, name: APP,     route_target: "65000:10200"}
  - {vlan: 300, vni: 10300, name: DB,      route_target: "65000:10300"}
  - {vlan: 400, vni: 10400, name: STORAGE, route_target: "65000:10400"}

# L3VNIs (symmetric IRB).
vrfs:
  - {name: TENANT-A, id: 10, vni: 50010, route_target: "65000:50010"}
  - {name: TENANT-B, id: 20, vni: 50020, route_target: "65000:50020"}

sites:
  - name: LVD
    location: "Las Vegas, NV"
    pods:
      - name: LVD-POD1
        spine_asn: 65100
        spines:
          - hostname: lvd-sp01
            loopback: 10.11.0.1
            fabric_interfaces: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4]
          - hostname: lvd-sp02
            loopback: 10.11.0.2
            fabric_interfaces: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4]
        leaf_pairs:
          - name: lvd-lp01
            asn: 65111
            segments: [100, 200]
            vrfs: [TENANT-A]
            leaves:
              - hostname: lvd-lf01a
                loopback: 10.11.0.11
                fabric_interfaces: [Ethernet1/49, Ethernet1/50]
              - hostname: lvd-lf01b
                loopback: 10.11.0.12
                fabric_interfaces: [Ethernet1/49, Ethernet1/50]
          - name: lvd-lp02
            asn: 65112
            segments: [200, 300, 400]
            vrfs: [TENANT-A, TENANT-B]
            leaves:
              - hostname: lvd-lf02a
                loopback: 10.11.0.13
                fabric_interfaces: [Ethernet1/49, Ethernet1/50]
              - hostname: lvd-lf02b
                loopback: 10.11.0.14
                fabric_interfaces: [Ethernet1/49, Ethernet1/50]

  - name: SAC
    location: "Sacramento, CA"
    pods:
      - name: SAC-POD1
        spine_asn: 65200
        spines:
          - hostname: sac-sp01
            loopback: 10.21.0.1
            fabric_interfaces: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4]
          - hostname: sac-sp02
            loopback: 10.21.0.2
            fabric_interfaces: [Ethernet1/1, Ethernet1/2, Ethernet1/3, Ethernet1/4]
        leaf_pairs:
          - name: sac-lp01
            asn: 65211
            segments: [100, 200]
            vrfs: [TENANT-A]
            leaves:
              - hostname: sac-lf01a
                loopback: 10.21.0.11
                fabric_interfaces: [Ethernet1/49, Ethernet1/50]
              - hostname: sac-lf01b
                loopback: 10.21.0.12
                fabric_interfaces: [Ethernet1/49, Ethernet1/50]
          - name: sac-lp02
            asn: 65212
            segments: [300, 400]
            vrfs: [TENANT-B]
            leaves:
              - hostname: sac-lf02a
                loopback: 10.21.0.13
                fabric_interfaces: [Ethernet1/49, Ethernet1/50]
              - hostname: sac-lf02b
                loopback: 10.21.0.14
                fabric_interfaces: [Ethernet1/49, Ethernet1/50]
